# SynthGen Default Training Configuration
# See docs/TRAINING.md for detailed explanations

# Model Architecture
vae_latent_dim: 64
dit_model_dim: 1024
dit_num_heads: 16
dit_num_layers: 20
dit_mlp_ratio: 4.0

# Audio Parameters
sample_rate: 44100
audio_channels: 2
max_duration: 15.0

# Training Stage: "vae" or "dit"
stage: "dit"

# Optimization
# NOTE: max_steps and warmup_steps count OPTIMIZER steps. One optimizer step
# consumes gradient_accumulation_steps micro-batches.
batch_size: 16
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
weight_decay: 0.01
max_steps: 500000
warmup_steps: 5000
min_lr: 1.0e-6

# Stage-1 (VAE) objective weights
vae_l1_weight: 0.1
vae_spectral_weight: 1.0
vae_mel_weight: 15.0
vae_kl_weight: 1.0e-4
vae_adv_weight: 1.0
vae_fm_weight: 2.0

# Stage-1 adversarial training. The critic is engaged only after
# disc_start_step so the decoder gets a purely reconstructive warm-up first.
adversarial: true
disc_start_step: 5000
disc_learning_rate: 1.0e-4
disc_weight_decay: 0.01
disc_periods: [2, 3, 5, 7, 11]
disc_stft_channels: 32

# Mixed Precision: "no", "fp16", "bf16"
mixed_precision: "bf16"

# Checkpointing
checkpoint_dir: "./checkpoints"
save_every_steps: 5000
resume_from: null

# Logging / experiment tracking (ClearML is primary)
log_every_steps: 100
eval_every_steps: 2500
use_clearml: false
clearml_project: "synthgen"
clearml_task_name: null
clearml_tags: []
clearml_dataset_name: "synthgen-data"
clearml_register_dataset: true
clearml_upload_checkpoints: false
use_wandb: false
wandb_project: "synthgen"

# Data
data_dir: "./data"
num_workers: 8

# Classifier-Free Guidance
cfg_dropout_prob: 0.1
