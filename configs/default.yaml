# SynthGen Default Training Configuration
# See docs/TRAINING.md for detailed explanations

# Model Architecture
vae_latent_dim: 64
dit_model_dim: 1024
dit_num_heads: 16
dit_num_layers: 20
dit_mlp_ratio: 4.0

# Audio Parameters
sample_rate: 44100
audio_channels: 2
max_duration: 15.0

# Training Stage: "vae" or "dit"
stage: "dit"

# Optimization
batch_size: 16
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
weight_decay: 0.01
max_steps: 500000
warmup_steps: 5000
min_lr: 1.0e-6

# Mixed Precision: "no", "fp16", "bf16"
mixed_precision: "bf16"

# Checkpointing
checkpoint_dir: "./checkpoints"
save_every_steps: 5000
resume_from: null

# Logging / experiment tracking (ClearML is primary)
log_every_steps: 100
eval_every_steps: 2500
use_clearml: false
clearml_project: "synthgen"
clearml_task_name: null
clearml_tags: []
clearml_dataset_name: "synthgen-data"
clearml_register_dataset: true
clearml_upload_checkpoints: false
use_wandb: false
wandb_project: "synthgen"

# Data
data_dir: "./data"
num_workers: 8

# Classifier-Free Guidance
cfg_dropout_prob: 0.1

# ---------------------------------------------------------------------------
# VAE objective (stage: "vae" only). See docs/VAE_OBJECTIVE.md.
# ---------------------------------------------------------------------------
vae_l1_weight: 0.1
vae_spectral_weight: 0.25      # legacy linear-magnitude MRSTFT, broadband anchor
vae_mel_weight: 15.0           # multi-scale log-mel (mid/side), the main term
vae_kl_weight: 1.0e-4
vae_mid_side: true             # measure spectral error on mid/side, not L/R

# Adversarial training: the only part of the objective that sees phase.
adv_enabled: true
adv_start_step: 20000          # reconstruction-only warmup before the GAN engages
adv_weight: 1.0
fm_weight: 2.0
adv_mode: "hinge"              # "hinge" or "lsgan"
disc_learning_rate: 1.0e-4

# Restore the pre-rework objective exactly (also disables the discriminator).
legacy_vae_objective: false
