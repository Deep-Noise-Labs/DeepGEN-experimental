# SynthGen Default Training Configuration
# See docs/TRAINING.md for detailed explanations

# Model Architecture
vae_latent_dim: 64
dit_model_dim: 1024
dit_num_heads: 16
dit_num_layers: 20
dit_mlp_ratio: 4.0

# Audio Parameters
sample_rate: 44100
audio_channels: 2
max_duration: 15.0

# Training Stage: "vae" or "dit"
stage: "dit"

# Optimization
batch_size: 16
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
weight_decay: 0.01
max_steps: 500000
warmup_steps: 5000
min_lr: 1.0e-6

# Mixed Precision: "no", "fp16", "bf16"
mixed_precision: "bf16"

# Checkpointing
checkpoint_dir: "./checkpoints"
save_every_steps: 5000
resume_from: null

# Logging / experiment tracking (ClearML is primary)
log_every_steps: 100
eval_every_steps: 2500
use_clearml: false
clearml_project: "synthgen"
clearml_task_name: null
clearml_tags: []
clearml_dataset_name: "synthgen-data"
clearml_register_dataset: true
clearml_upload_checkpoints: false
use_wandb: false
wandb_project: "synthgen"

# Data
data_dir: "./data"
num_workers: 8

# Classifier-Free Guidance
cfg_dropout_prob: 0.1

# Sample-grade preprocessing (synthgen/data/preprocessing.py)
# Loudness target and true-peak ceiling follow commercial one-shot conventions.
target_rms_db: -20.0
peak_ceiling_db: -1.0
silence_floor_db: -60.0
onset_threshold_db: -35.0
onset_pre_roll_ms: 10.0
# Fraction of crops from long sources anchored to the attack; the rest stay random.
onset_anchor_prob: 0.5
# Attenuation-only: applied after normalisation it cannot breach the ceiling.
gain_db_range: [-6.0, 0.0]
trim_silence: true
