# Stage-1 VAE training on AudioCaps (pipeline validation budget)
stage: "vae"

vae_latent_dim: 64
sample_rate: 44100
audio_channels: 2
max_duration: 15.0

# 15s stereo @ 44.1kHz with multi-res STFT is memory-heavy; keep micro-batch small
batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
weight_decay: 0.01
max_steps: 10000
warmup_steps: 500
min_lr: 1.0e-6
mixed_precision: "bf16"

checkpoint_dir: "./checkpoints/vae_audiocaps"
save_every_steps: 1000
resume_from: null

# VAE objective. See docs/VAE_OBJECTIVE.md for why these weights, and for the
# measurement that motivated them.
vae_l1_weight: 0.1
vae_spectral_weight: 0.25      # legacy linear-magnitude MRSTFT, broadband anchor
vae_mel_weight: 15.0           # multi-scale log-mel (mid/side), the main term
vae_kl_weight: 1.0e-4
vae_mid_side: true

# Adversarial training. The discriminator is the only term that sees phase.
# adv_start_step should sit after the reconstruction loss has flattened - on
# this 10k-step validation budget that is most of the run, so adversarial
# training only engages for the tail. Raise max_steps for a real stage-1 run.
adv_enabled: true
adv_start_step: 6000
adv_weight: 1.0
fm_weight: 2.0
adv_mode: "hinge"
disc_learning_rate: 1.0e-4

# Set true to restore the pre-rework objective exactly (and disable the
# discriminator). This is the A/B baseline and the rollback switch.
legacy_vae_objective: false

log_every_steps: 50
eval_every_steps: 1000
use_clearml: false
clearml_project: "synthgen-vae"
clearml_task_name: "vae-audiocaps"
clearml_tags: ["vae", "audiocaps"]
clearml_dataset_name: "audiocaps"
clearml_register_dataset: true
clearml_upload_checkpoints: false
use_wandb: false
wandb_project: "synthgen"

data_dir: "./data/audiocaps"
num_workers: 4
max_samples: null
