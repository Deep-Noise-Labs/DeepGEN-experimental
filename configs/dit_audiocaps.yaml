# Stage-2 DiT training on AudioCaps (pipeline validation budget)
stage: "dit"

vae_latent_dim: 64
dit_model_dim: 1024
dit_num_heads: 16
dit_num_layers: 20
dit_mlp_ratio: 4.0

sample_rate: 44100
audio_channels: 2
max_duration: 15.0

batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
weight_decay: 0.01
max_steps: 10000
warmup_steps: 500
min_lr: 1.0e-6
mixed_precision: "bf16"

checkpoint_dir: "./checkpoints/dit_audiocaps"
save_every_steps: 1000
resume_from: null
vae_checkpoint: "./checkpoints/vae_audiocaps/checkpoint-9000.pt"

cfg_dropout_prob: 0.1

log_every_steps: 50
eval_every_steps: 1000
use_clearml: false
clearml_project: "synthgen-dit"
clearml_task_name: "dit-audiocaps"
clearml_tags: ["dit", "audiocaps"]
clearml_dataset_name: "audiocaps"
# Full AudioCaps manifests are multi-MB; skip ClearML upload (413 on small fileservers)
clearml_register_dataset: false
clearml_upload_checkpoints: false
use_wandb: false
wandb_project: "synthgen"

data_dir: "./data/audiocaps"
num_workers: 4
max_samples: null

# Sample-grade preprocessing (synthgen/data/preprocessing.py)
# Loudness target and true-peak ceiling follow commercial one-shot conventions.
target_rms_db: -20.0
peak_ceiling_db: -1.0
silence_floor_db: -60.0
onset_threshold_db: -35.0
onset_pre_roll_ms: 10.0
# Fraction of crops from long sources anchored to the attack; the rest stay random.
onset_anchor_prob: 0.5
# Attenuation-only: applied after normalisation it cannot breach the ceiling.
gain_db_range: [-6.0, 0.0]
trim_silence: true
